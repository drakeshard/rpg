name: Openfield Integration Sample

on:
  pull_request:
    paths:
      - "examples/openfield/**"
      - "src/resources/**"
      - ".github/workflows/openfield-pages.yml"
  push:
    branches: [main]
    paths:
      - "examples/openfield/**"
      - "src/resources/**"
      - ".github/workflows/openfield-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: openfield-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Openfield sample
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout RPG
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.21.0

      - name: Install sample dependencies
        working-directory: examples/openfield
        run: npm install --no-package-lock

      - name: Build sample
        working-directory: examples/openfield
        run: npm run build

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: examples/openfield/dist

  deploy:
    name: Deploy Openfield sample
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
