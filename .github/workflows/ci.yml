name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version

      - name: Enable Corepack
        run: corepack enable

      - name: Require committed lockfile
        run: test -f pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting and lint
        run: pnpm check:format

      - name: Check architecture boundaries
        run: pnpm check:architecture

      - name: Check package and incubation invariants
        run: pnpm check:package

      - name: Typecheck source
        run: pnpm typecheck:src

      - name: Typecheck tests
        run: pnpm typecheck:test

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Check build artifact shape
        run: pnpm check:build
